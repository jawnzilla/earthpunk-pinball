<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 150" fill="none" role="img" aria-label="Central corridor telemetry spine">
<defs><linearGradient id="rail"><stop stop-color="#d7e8d0"/><stop offset=".45" stop-color="#526e63"/><stop offset="1" stop-color="#102324"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<!-- shallow side rails, central travel stays open -->
<path d="M10 8v134M86 8v134" stroke="url(#rail)" stroke-width="3"/><path d="M16 14v122M80 14v122" stroke="#67c8d5" stroke-opacity=".38" stroke-width="2"/>
