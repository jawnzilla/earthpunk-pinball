<circle cx="20" cy="18" r="5" fill="#071416" stroke="#ef8b45" stroke-width="2" filter="url(#glow)"/><circle cx="76" cy="18" r="5" fill="#071416" stroke="#67c8d5" stroke-width="2" filter="url(#glow)"/>
<circle cx="20" cy="72" r="5" fill="#071416" stroke="#67c8d5" stroke-width="2"/><circle cx="76" cy="72" r="5" fill="#071416" stroke="#ef8b45" stroke-width="2"/>
<circle cx="20" cy="126" r="5" fill="#071416" stroke="#ffd083" stroke-width="2"/><circle cx="76" cy="126" r="5" fill="#071416" stroke="#ffd083" stroke-width="2"/>
<!-- central telemetry marks -->
<path d="M48 18v18M48 52v18M48 86v18M48 120v18" stroke="#9fd4c0" stroke-opacity=".28" stroke-width="2" stroke-dasharray="4 6"/>
<circle cx="48" cy="72" r="4" fill="#fff0ba" filter="url(#glow)"/>
</svg>