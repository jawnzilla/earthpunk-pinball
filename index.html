<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#101518">
  <title>Deadlight // Earthpunk Pinball</title>
  <style>
    :root { color-scheme: dark; font-family: "Trebuchet MS", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #101518; color: #e9f1df; }
    body { display: grid; place-items: center; overflow: hidden; }
    main { width: min(100vw, 520px); min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; padding: max(12px, env(safe-area-inset-top)) 12px max(10px, env(safe-area-inset-bottom)); gap: 10px; }
    header { display: flex; justify-content: space-between; align-items: end; gap: 12px; }
    header > div:first-child { min-width: 0; }
    h1 { margin: 0; color: #f1b35b; font-size: clamp(18px, 5vw, 25px); letter-spacing: .12em; text-transform: uppercase; }
    .subtitle { margin: 3px 0 0; color: #87a39b; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
    .status { min-width: 0; flex: 0 1 auto; text-align: right; color: #c4d2bd; font-size: 12px; line-height: 1.45; }
    @media (max-width: 360px) {
      main { padding-left: 8px; padding-right: 8px; gap: 7px; }
      header { align-items: start; gap: 6px; }
      h1 { font-size: 18px; }
      .subtitle { font-size: 9px; line-height: 1.1; white-space: normal; max-width: 150px; }
      .status { max-width: 142px; font-size: 10px; line-height: 1.25; }
      footer { font-size: 10px; }
    }
    .status strong { color: #f1b35b; }
    .table-wrap { min-width: 0; min-height: 0; display: grid; place-items: center; overflow: hidden; }
    canvas { width: min(100%, 420px); height: auto; max-width: 100%; max-height: 100%; aspect-ratio: 9 / 16; display: block; border: 2px solid #38524e; border-radius: 18px; background: #182226; box-shadow: 0 0 0 5px #0c1012, 0 16px 50px rgba(0,0,0,.45); touch-action: none; }
    @media (max-height: 760px) {
      main { gap: 6px; }
      canvas { width: min(100%, calc((100dvh - 142px) * .5625)); height: auto; max-width: 100%; max-height: 100%; }
    }
    footer { color: #87a39b; text-align: center; font-size: 12px; letter-spacing: .03em; }
    footer b { color: #e9f1df; }
    .overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: radial-gradient(circle at 50% 42%, rgba(41,76,66,.38), rgba(5,8,9,.92) 68%); backdrop-filter: blur(4px); overflow: auto; }
    .overlay[hidden] { display: none; }
    .card { position: relative; width: min(100%, 370px); max-height: calc(100dvh - 32px); overflow: auto; padding: 25px; border: 1px solid #91a88f; border-radius: 10px; background: linear-gradient(145deg, #263c3a, #121b1e 70%); box-shadow: 0 0 0 4px #0b1112, 0 0 0 6px #526e63, 0 22px 90px rgba(0,0,0,.72), inset 0 1px rgba(255,255,255,.12); }
    .card::before { content: ''; position: absolute; inset: 8px; pointer-events: none; border: 1px solid rgba(241,179,91,.28); border-radius: 5px; background: repeating-linear-gradient(135deg, transparent 0 12px, rgba(241,179,91,.025) 12px 14px); }
    .card h2, .card p, .choices, .card > button { position: relative; z-index: 1; }
    .card h2 { margin: 0 0 8px; color: #ffd083; text-shadow: 0 0 18px rgba(241,179,91,.28); text-transform: uppercase; letter-spacing: .1em; }
    .card p { color: #c4d2bd; line-height: 1.5; }
    .choices { display: grid; gap: 8px; margin: 16px 0; }
    .choices button { display: grid; grid-template-columns: 38px 1fr; text-align: left; padding: 10px 14px 10px 10px; min-height: 62px; background: linear-gradient(110deg, #314e49, #1d2d2e); color: #e9f1df; border: 1px solid #648274; text-transform: none; letter-spacing: .02em; }
    .choices button:hover { border-color: #f1b35b; box-shadow: 0 0 18px rgba(241,179,91,.16); }
    .choices button:disabled { opacity: .42; filter: saturate(.45); cursor: not-allowed; }
    .choices button strong { display: block; color: #ffd083; text-transform: uppercase; letter-spacing: .08em; }
    .choices button small { display: block; margin-top: 3px; color: #b8cbbb; line-height: 1.3; }
    .upgrade-icon { display: grid; place-items: center; width: 28px; height: 28px; border: 1px solid #f1b35b; border-radius: 50%; color: #f1b35b; font-size: 17px; }
    .choices button:active { background: #38524e; }
    button { width: 100%; min-height: 48px; border: 0; border-radius: 10px; color: #101518; background: #f1b35b; font: inherit; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
    .debug-toggle { position: fixed; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); z-index: 5; width: auto; min-height: 34px; padding: 6px 10px; border: 1px solid #789487; border-radius: 6px; color: #c4d2bd; background: rgba(9,17,19,.9); font-size: 11px; }
    .debug-panel { position: fixed; right: 12px; bottom: max(54px, calc(env(safe-area-inset-bottom) + 42px)); z-index: 5; width: min(260px, calc(100vw - 24px)); padding: 12px; border: 1px solid #789487; border-radius: 8px; background: rgba(9,17,19,.96); box-shadow: 0 12px 30px rgba(0,0,0,.45); }
    .debug-panel[hidden] { display: none; }
    .debug-panel h3 { margin: 0 0 5px; color: #ffd083; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
    .debug-panel p { margin: 0 0 8px; color: #9fb5a7; font-size: 10px; line-height: 1.3; }
    .debug-row { display: grid; grid-template-columns: 1fr 54px; gap: 8px; align-items: center; margin: 7px 0; color: #c4d2bd; font-size: 11px; }
    .debug-row input { width: 100%; accent-color: #f1b35b; }
    .debug-value { color: #f1b35b; text-align: right; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <main>
    <header>
      <div><h1>Deadlight</h1><p class="subtitle">Earthpunk pinball // prototype 01</p></div>
      <div class="status"><strong id="stage">BOOT</strong><br><span id="message">Keep the probe alive.</span></div>
    </header>
    <div class="table-wrap"><canvas id="game" width="360" height="640" aria-label="Deadlight pinball table"></canvas></div>
    <footer><b>Touch left/right</b> to work the flippers · keyboard: A / D or ← / →</footer>
  </main>
  <div class="overlay" id="overlay" hidden>
    <section class="card"><h2 id="overlay-title">Probe recovered</h2><p id="overlay-copy"></p><div class="choices" id="choices" hidden></div><button id="reset">Start another descent</button></section>
  </div>
  <button class="debug-toggle" id="debug-toggle" type="button">Tune</button>
  <section class="debug-panel" id="debug-panel" hidden aria-label="Physics tuning controls">
    <h3>Live physics tuning</h3>
    <p>Higher gravity feels heavier. Kick is first-hit power. Separation breaks rolling contact.</p>
    <label class="debug-row" title="Downward acceleration applied every fixed update.">Gravity <input data-tune="gravity" type="range" min="0.01" max="0.13" step="0.01" value="0.07"><span class="debug-value" data-value="gravity">0.07</span></label>
    <label class="debug-row" title="Maximum outward impulse on the first active flipper contact.">Active kick <input data-tune="activeKick" type="range" min="0.5" max="12" step="0.1" value="8"><span class="debug-value" data-value="activeKick">8.00</span></label>
    <label class="debug-row" title="Energy retained when a stationary held flipper catches the ball.">Catch damping <input data-tune="catchRestitution" type="range" min="0" max="0.5" step="0.01" value="0"><span class="debug-value" data-value="catchRestitution">0.00</span></label>
    <label class="debug-row" title="Energy retained when the flipper is moving during contact.">Moving rebound <input data-tune="movingRestitution" type="range" min="0.1" max="0.9" step="0.01" value="0.1"><span class="debug-value" data-value="movingRestitution">0.10</span></label>
    <label class="debug-row" title="Energy retained when the flipper is released and acts as a passive rail.">Passive rebound <input data-tune="passiveRestitution" type="range" min="0.3" max="1" step="0.01" value="0.3"><span class="debug-value" data-value="passiveRestitution">0.30</span></label>
    <label class="debug-row" title="Small outward/upward push applied while an active contact remains locked.">Contact separation <input data-tune="contactSeparation" type="range" min="0.1" max="2" step="0.05" value="2"><span class="debug-value" data-value="contactSeparation">2.00</span></label>
    <label class="debug-row" title="Hard maximum ball speed after collisions and tuning.">Speed cap <input data-tune="maxSpeed" type="range" min="3" max="10" step="0.1" value="7"><span class="debug-value" data-value="maxSpeed">7.00</span></label>
  </section>
<script>
(() => {
  "use strict";
  const canvas = document.querySelector('#game');
  const ctx = canvas.getContext('2d');
  const stageEl = document.querySelector('#stage');
  const messageEl = document.querySelector('#message');
  const overlay = document.querySelector('#overlay');
  const overlayTitle = document.querySelector('#overlay-title');
  const overlayCopy = document.querySelector('#overlay-copy');
  const choices = document.querySelector('#choices');
  const resetButton = document.querySelector('#reset');
  const debugToggle = document.querySelector('#debug-toggle');
  const debugPanel = document.querySelector('#debug-panel');
  const debugConfig = { gravity: .07, activeKick: 8, catchRestitution: 0, movingRestitution: .1, passiveRestitution: .3, contactSeparation: 2, maxSpeed: 7 };
  debugToggle.addEventListener('click', () => { debugPanel.hidden = !debugPanel.hidden; });
  debugPanel.querySelectorAll('[data-tune]').forEach(inputEl => inputEl.addEventListener('input', () => {
    const key = inputEl.dataset.tune; debugConfig[key] = Number(inputEl.value); if (state && key === 'maxSpeed') state.maxSpeed = debugConfig.maxSpeed; debugPanel.querySelector(`[data-value="${key}"]`).textContent = debugConfig[key].toFixed(2);
  }));
  const upgradePool = [
    { id: 'bulkhead', icon: '◆', title: 'Reinforced bulkhead', text: '+1 maximum Stability and restore one point.', apply: s => { s.stabilityMax += 1; s.stability += 1; } },
    { id: 'coil', icon: 'ϟ', title: 'Tuned launch coil', text: 'Raise the safe ball-speed ceiling for stronger, more controlled returns.', apply: s => { s.maxSpeed += .6; } },
    { id: 'magnet', icon: '✦', title: 'Salvage magnet', text: 'Every salvage target yields an additional Charge.', apply: s => { s.salvageBonus += 1; } },
    { id: 'repair', icon: '+', title: 'Patch the pressure hull', text: 'Spend Charge to restore one Stability.', cost: 2, apply: s => { s.stability = Math.min(s.stabilityMax, s.stability + 1); } },
    { id: 'hydraulic', icon: '↗', title: 'Hydraulic flipper arms', text: '+1.2 active kick and a stronger moving rebound.', cost: 3, apply: s => { s.flipperKickBonus += 1.2; s.flipperReboundBonus += .08; } },
    { id: 'longarms', icon: '⟷', title: 'Extended flipper arms', text: '+8px to both flippers for wider rescue coverage.', cost: 4, apply: s => { s.flipperLengthBonus += 8; } }
  ];
  const W = canvas.width, H = canvas.height;
  const table = { left: 18, right: W - 18, top: 18, bottom: H - 18 };
  const levelLayouts = [
    { name: 'Generator Well', targetPositions: [[90, 164, 17], [180, 134, 17], [270, 164, 17], [77, 274, 15], [283, 274, 15], [180, 242, 14]], bumpers: [{ x: 112, y: 350, r: 25, type: 'standard' }, { x: 248, y: 350, r: 25, type: 'standard' }], gate: null },
    { name: 'Pulse Manifold', targetPositions: [[70, 150, 15], [180, 184, 15], [290, 150, 15], [96, 260, 17], [264, 260, 17], [180, 298, 14]], bumpers: [{ x: 92, y: 332, r: 21, type: 'pulse' }, { x: 268, y: 332, r: 21, type: 'pulse' }, { x: 180, y: 390, r: 18, type: 'pulse' }], gate: { x1: 102, y1: 470, x2: 258, y2: 470, width: 9 } },
    { name: 'Split Reactor', targetPositions: [[58, 170, 15], [302, 170, 15], [180, 196, 16], [72, 276, 17], [288, 276, 17], [155, 330, 14]], bumpers: [{ x: 78, y: 318, r: 18, type: 'armor', hits: 0 }, { x: 282, y: 318, r: 18, type: 'armor', hits: 0 }, { x: 118, y: 408, r: 18, type: 'standard' }, { x: 242, y: 408, r: 18, type: 'standard' }], gate: { x1: 180, y1: 300, x2: 180, y2: 470, width: 8 } }
  ];
  function resetLayoutDamage() { levelLayouts.forEach(layout => layout.bumpers.forEach(item => { item.hits = 0; })); }
  function applyTargetLayout() { state.layout.targetPositions.forEach((position, index) => { const target = targets[index]; target.x = position[0]; target.y = position[1]; target.r = position[2]; target.hit = false; }); }
  let input = { left: false, right: false };
  let activePointerId = null;
  let activePointerSide = null;
  let state;
  const targets = [
    { x: 90, y: 164, r: 17, hit: false }, { x: 180, y: 134, r: 17, hit: false }, { x: 270, y: 164, r: 17, hit: false },
    { x: 77, y: 274, r: 15, hit: false }, { x: 283, y: 274, r: 15, hit: false }, { x: 180, y: 242, r: 14, hit: false }
  ];
  const bumpers = levelLayouts[0].bumpers;
  const flippers = {
    left: { pivotX: 64, pivotY: H - 75, length: 78, width: 15, rest: .16, active: -.5, angle: .16, angularVelocity: 0 },
    right: { pivotX: 296, pivotY: H - 75, length: 78, width: 15, rest: Math.PI - .16, active: Math.PI + .5, angle: Math.PI - .16, angularVelocity: 0 }
  };
  const sideGuards = [
    { x1: table.left + 8, y1: H - 95, x2: 48, y2: H - 82 },
    { x1: W - table.left - 8, y1: H - 95, x2: W - 48, y2: H - 82 }
  ];
  const MAX_BALL_SPEED = 6.4;
  const keys = { a: false, d: false, ArrowLeft: false, ArrowRight: false };

  function reset() {
    state = { stage: 1, stageCount: 3, score: 0, charge: 0, combo: 0, comboTimer: 0, stability: 3, stabilityMax: 3, salvageBonus: 1, maxSpeed: debugConfig.maxSpeed, flipperKickBonus: 0, flipperReboundBonus: 0, flipperLengthBonus: 0, layout: levelLayouts[0], relayCooldown: 0, targets: 0, running: true, launched: false, flash: 0, pulse: 0, flipperEffectCooldown: 0, flipperContacts: { left: false, right: false }, effects: [], message: 'Map the first descent.' };
    input.left = false; input.right = false; activePointerId = null; activePointerSide = null; Object.keys(keys).forEach(key => keys[key] = false);
    targets.forEach(t => t.hit = false);
    resetLayoutDamage();
    applyTargetLayout();
    choices.hidden = true; choices.replaceChildren(); resetButton.hidden = false; overlay.hidden = true;
    spawnBall();
    updateHud();
  }
  function spawnBall() {
    state.flipperContacts.left = false; state.flipperContacts.right = false;
    const launchSide = Math.random() < .5 ? -1 : 1;
    state.ball = { x: W / 2, y: H - 108, vx: launchSide * (1.1 + Math.random() * .7), vy: -5.2, r: 8, trail: [], prevX: W / 2, prevY: H - 108 };
    state.launched = true;
  }
  function updateHud() {
    stageEl.textContent = state.running ? `DESCENT ${state.stage}/${state.stageCount} · ${state.layout.name.toUpperCase()} · STABILITY ${state.stability}/${state.stabilityMax}` : (state.stability > 0 ? `DESCENT ${state.stage}/${state.stageCount} · RECOVERED` : 'COLLAPSE');
    messageEl.textContent = state.message;
  }
  function setMessage(text) { state.message = text; updateHud(); }
  function chainHit() { state.combo = state.comboTimer > 0 ? state.combo + 1 : 1; state.comboTimer = 90; return 1 + (state.combo - 1) * .25; }
  function emitImpact(x, y, color, power = 1) { state.effects.push({ x, y, color, power, life: 1 }); if (state.effects.length > 36) state.effects.shift(); }
  function hitTarget(target) {
    const multiplier = chainHit(); target.hit = true; state.targets += 1; state.charge = Math.min(99, state.charge + state.salvageBonus); state.score += Math.round(100 * multiplier); state.flash = 3; emitImpact(target.x, target.y, '#f1b35b', 1.25);
    setMessage(state.targets === targets.length ? 'Descent mapped. Choose a modification.' : `Salvage secured. Chain x${multiplier.toFixed(2)}.`);
    if (state.targets === targets.length) completeStage();
  }
  function completeStage() {
    state.running = false;
    if (state.stage >= state.stageCount) { win(); return; }
    overlayTitle.textContent = `Descent ${state.stage} stabilized`;
    overlayCopy.textContent = `Choose one modification before the probe drops deeper. Charge: ${Math.floor(state.charge)} · Score: ${state.score}.`;
    choices.replaceChildren(...upgradePool.map(upgrade => { const button = document.createElement('button'); button.type = 'button'; button.dataset.upgrade = upgrade.id; button.disabled = Boolean((upgrade.cost && state.charge < upgrade.cost) || (upgrade.id === 'repair' && state.stability >= state.stabilityMax)); const price = upgrade.cost ? ` · COST ${upgrade.cost} CHARGE` : ' · FREE'; button.innerHTML = `<span class="upgrade-icon" aria-hidden="true">${upgrade.icon}</span><span><strong>${upgrade.title}</strong><small>${upgrade.text}${price}</small></span>`; button.addEventListener('click', () => chooseUpgrade(upgrade)); return button; }));
    choices.hidden = false; resetButton.hidden = true; overlay.hidden = false; updateHud();
  }
  function chooseUpgrade(upgrade) {
    if (upgrade.cost && state.charge < upgrade.cost) return;
    if (upgrade.id === 'repair' && state.stability >= state.stabilityMax) return;
    if (upgrade.cost) state.charge -= upgrade.cost;
    upgrade.apply(state); state.stage += 1; state.layout = levelLayouts[state.stage - 1]; state.targets = 0; applyTargetLayout(); resetLayoutDamage(); state.relayCooldown = 0; state.message = `${upgrade.title} installed. ${state.layout.name} online.`; choices.hidden = true; choices.replaceChildren(); resetButton.hidden = false; overlay.hidden = true; state.running = true; spawnBall(); updateHud();
  }
  function win() { choices.hidden = true; choices.replaceChildren(); resetButton.hidden = false; overlayTitle.textContent = 'Surface signal acquired'; overlayCopy.textContent = `The probe found a route through the buried machine. Descent complete. Salvage: ${state.charge} · Score: ${state.score}.`; overlay.hidden = false; updateHud(); }
  function lose() { choices.hidden = true; choices.replaceChildren(); resetButton.hidden = false; state.running = false; overlayTitle.textContent = 'Probe lost in the dark'; overlayCopy.textContent = `The tunnel collapsed before the route was mapped. Salvage: ${state.charge} · Score: ${state.score}.`; overlay.hidden = false; updateHud(); }
  function circleCollision(ball, item, restitution = 1) {
    const dx = ball.x - item.x, dy = ball.y - item.y, min = ball.r + item.r;
    const dist = Math.hypot(dx, dy);
    if (dist < min && dist > 0) {
      const nx = dx / dist, ny = dy / dist;
      ball.x = item.x + nx * min; ball.y = item.y + ny * min;
      const dot = ball.vx * nx + ball.vy * ny;
      ball.vx -= (1 + restitution) * dot * nx; ball.vy -= (1 + restitution) * dot * ny;
      return true;
    }
    return false;
  }
  function capBallSpeed(ball, maxSpeed = state?.maxSpeed || MAX_BALL_SPEED) {
    const speed = Math.hypot(ball.vx, ball.vy);
    if (speed > maxSpeed) { const scale = maxSpeed / speed; ball.vx *= scale; ball.vy *= scale; }
  }
  function flipperEndpoints(flipper) {
    return flipperEndpointsAt(flipper, flipper.angle);
  }
  function flipperEndpointsAt(flipper, angle) {
    return { x1: flipper.pivotX, y1: flipper.pivotY, x2: flipper.pivotX + Math.cos(angle) * (flipper.length + (state?.flipperLengthBonus || 0)), y2: flipper.pivotY + Math.sin(angle) * (flipper.length + (state?.flipperLengthBonus || 0)) };
  }
  function segmentCollision(ball, segment, restitution = .82, kick = 0, upwardEscape = 0) {
    const dx = segment.x2 - segment.x1, dy = segment.y2 - segment.y1;
    const lengthSquared = dx * dx + dy * dy || 1;
    const midpointSegment = segment.previous ? { x1: (segment.x1 + segment.previous.x1) / 2, y1: (segment.y1 + segment.previous.y1) / 2, x2: (segment.x2 + segment.previous.x2) / 2, y2: (segment.y2 + segment.previous.y2) / 2 } : segment;
    const samples = [[ball.x, ball.y, segment, false], [(ball.x + (ball.prevX ?? ball.x)) / 2, (ball.y + (ball.prevY ?? ball.y)) / 2, midpointSegment, true]];
    let hit = null;
    for (const [sampleX, sampleY, sampleSegment, swept] of samples) {
      const sampleDx = sampleSegment.x2 - sampleSegment.x1, sampleDy = sampleSegment.y2 - sampleSegment.y1;
      const sampleLengthSquared = sampleDx * sampleDx + sampleDy * sampleDy || 1;
      const projection = Math.max(0, Math.min(1, ((sampleX - sampleSegment.x1) * sampleDx + (sampleY - sampleSegment.y1) * sampleDy) / sampleLengthSquared));
      const closestX = sampleSegment.x1 + projection * sampleDx, closestY = sampleSegment.y1 + projection * sampleDy;
      const nx0 = sampleX - closestX, ny0 = sampleY - closestY;
      const distance = Math.hypot(nx0, ny0), radius = ball.r + (segment.width || 0) / 2;
      const entering = !swept || ball.vx * nx0 + ball.vy * ny0 < 0;
      const bladeClosing = swept && segment.previous && ((segment.x2 - segment.previous.x2) * nx0 + (segment.y2 - segment.previous.y2) * ny0 > 0);
      if (distance < radius && (entering || bladeClosing)) { hit = { sampleX, sampleY, closestX, closestY, nx: nx0, ny: ny0, radius }; break; }
    }
    if (!hit) return null;
    let { nx, ny } = hit;
    if (Math.hypot(nx, ny) < .001) { nx = -dy; ny = dx; }
    const normalLength = Math.hypot(nx, ny) || 1; nx /= normalLength; ny /= normalLength;
    ball.x = hit.closestX + nx * hit.radius; ball.y = hit.closestY + ny * hit.radius;
    const incoming = ball.vx * nx + ball.vy * ny;
    if (incoming < 0) { ball.vx -= (1 + restitution) * incoming * nx; ball.vy -= (1 + restitution) * incoming * ny; }
    const separatingVelocity = ball.vx * nx + ball.vy * ny;
    if (separatingVelocity < kick) { const correction = kick - separatingVelocity; ball.vx += nx * correction; ball.vy += ny * correction; }
    if (upwardEscape > 0) ball.vy = Math.min(ball.vy, -upwardEscape);
    capBallSpeed(ball);
    return { x: hit.closestX, y: hit.closestY, nx, ny };
  }
  function updateFlippers() {
    const leftTarget = input.left ? flippers.left.active : flippers.left.rest;
    const rightTarget = input.right ? flippers.right.active : flippers.right.rest;
    const leftPrevious = flippers.left.angle, rightPrevious = flippers.right.angle;
    flippers.left.previousAngle = leftPrevious;
    flippers.right.previousAngle = rightPrevious;
    flippers.left.angle += (leftTarget - flippers.left.angle) * .28;
    flippers.right.angle += (rightTarget - flippers.right.angle) * .28;
    flippers.left.angularVelocity = flippers.left.angle - leftPrevious;
    flippers.right.angularVelocity = flippers.right.angle - rightPrevious;
  }
  function update() {
    if (!state.running) return;
    const b = state.ball;
    state.pulse += .08; state.flash = Math.max(0, state.flash - 1); state.flipperEffectCooldown = Math.max(0, state.flipperEffectCooldown - 1); state.relayCooldown = Math.max(0, state.relayCooldown - 1); state.comboTimer = Math.max(0, state.comboTimer - 1); if (state.comboTimer === 0) state.combo = 0; state.effects.forEach(effect => effect.life -= .08); state.effects = state.effects.filter(effect => effect.life > 0);
