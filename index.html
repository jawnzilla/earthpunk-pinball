<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#101518">
  <title>Deadlight // Earthpunk Pinball</title>
  <style>
    :root { color-scheme: dark; font-family: "Trebuchet MS", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #101518; color: #e9f1df; }
    body { display: grid; place-items: center; overflow: hidden; }
    main { width: min(100vw, 520px); min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; padding: max(12px, env(safe-area-inset-top)) 12px max(10px, env(safe-area-inset-bottom)); gap: 10px; }
    header { display: flex; justify-content: space-between; align-items: end; gap: 12px; }
    header > div:first-child { min-width: 0; }
    h1 { margin: 0; color: #f1b35b; font-size: clamp(18px, 5vw, 25px); letter-spacing: .12em; text-transform: uppercase; }
    .subtitle { margin: 3px 0 0; color: #87a39b; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
    .status { min-width: 0; flex: 0 1 auto; text-align: right; color: #c4d2bd; font-size: 12px; line-height: 1.45; }
    @media (max-width: 360px) {
      main { padding-left: 8px; padding-right: 8px; gap: 7px; }
      header { align-items: start; gap: 6px; }
      h1 { font-size: 18px; }
      .subtitle { font-size: 9px; line-height: 1.1; white-space: normal; max-width: 150px; }
      .status { max-width: 142px; font-size: 10px; line-height: 1.25; }
      footer { font-size: 10px; }
    }
    .status strong { color: #f1b35b; }
    .table-wrap { min-width: 0; min-height: 0; display: grid; place-items: center; overflow: hidden; }
    canvas { width: min(100%, 420px); height: auto; max-width: 100%; max-height: 100%; aspect-ratio: 9 / 16; display: block; border: 2px solid #38524e; border-radius: 18px; background: #182226; box-shadow: 0 0 0 5px #0c1012, 0 16px 50px rgba(0,0,0,.45); touch-action: none; }
    @media (max-height: 760px) {
      main { gap: 6px; }
      canvas { width: min(100%, calc((100dvh - 142px) * .5625)); height: auto; max-width: 100%; max-height: 100%; }
    }
    footer { color: #87a39b; text-align: center; font-size: 12px; letter-spacing: .03em; }
    footer b { color: #e9f1df; }
    .overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: radial-gradient(circle at 50% 42%, rgba(41,76,66,.38), rgba(5,8,9,.92) 68%); backdrop-filter: blur(4px); overflow: auto; }
    .overlay[hidden] { display: none; }
    .card { position: relative; width: min(100%, 370px); max-height: calc(100dvh - 32px); overflow: auto; padding: 25px; border: 1px solid #91a88f; border-radius: 10px; background: linear-gradient(145deg, #263c3a, #121b1e 70%); box-shadow: 0 0 0 4px #0b1112, 0 0 0 6px #526e63, 0 22px 90px rgba(0,0,0,.72), inset 0 1px rgba(255,255,255,.12); }
    .card::before { content: ''; position: absolute; inset: 8px; pointer-events: none; border: 1px solid rgba(241,179,91,.28); border-radius: 5px; background: repeating-linear-gradient(135deg, transparent 0 12px, rgba(241,179,91,.025) 12px 14px); }
    .card h2, .card p, .choices, .card > button { position: relative; z-index: 1; }
    .card h2 { margin: 0 0 8px; color: #ffd083; text-shadow: 0 0 18px rgba(241,179,91,.28); text-transform: uppercase; letter-spacing: .1em; }
    .card p { color: #c4d2bd; line-height: 1.5; }
    .choices { display: grid; gap: 8px; margin: 16px 0; }
    .choices button { display: grid; grid-template-columns: 38px 1fr; text-align: left; padding: 10px 14px 10px 10px; min-height: 62px; background: linear-gradient(110deg, #314e49, #1d2d2e); color: #e9f1df; border: 1px solid #648274; text-transform: none; letter-spacing: .02em; }
    .choices button:hover { border-color: #f1b35b; box-shadow: 0 0 18px rgba(241,179,91,.16); }
    .choices button strong { display: block; color: #ffd083; text-transform: uppercase; letter-spacing: .08em; }
    .choices button small { display: block; margin-top: 3px; color: #b8cbbb; line-height: 1.3; }
    .upgrade-icon { display: grid; place-items: center; width: 28px; height: 28px; border: 1px solid #f1b35b; border-radius: 50%; color: #f1b35b; font-size: 17px; }
    .choices button:active { background: #38524e; }
    button { width: 100%; min-height: 48px; border: 0; border-radius: 10px; color: #101518; background: #f1b35b; font: inherit; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
    .debug-toggle { position: fixed; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); z-index: 5; width: auto; min-height: 34px; padding: 6px 10px; border: 1px solid #789487; border-radius: 6px; color: #c4d2bd; background: rgba(9,17,19,.9); font-size: 11px; }
    .debug-panel { position: fixed; right: 12px; bottom: max(54px, calc(env(safe-area-inset-bottom) + 42px)); z-index: 5; width: min(260px, calc(100vw - 24px)); padding: 12px; border: 1px solid #789487; border-radius: 8px; background: rgba(9,17,19,.96); box-shadow: 0 12px 30px rgba(0,0,0,.45); }
    .debug-panel[hidden] { display: none; }
    .debug-panel h3 { margin: 0 0 8px; color: #ffd083; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
    .debug-row { display: grid; grid-template-columns: 1fr 54px; gap: 8px; align-items: center; margin: 7px 0; color: #c4d2bd; font-size: 11px; }
    .debug-row input { width: 100%; accent-color: #f1b35b; }
    .debug-value { color: #f1b35b; text-align: right; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <main>
    <header>
      <div><h1>Deadlight</h1><p class="subtitle">Earthpunk pinball // prototype 01</p></div>
      <div class="status"><strong id="stage">BOOT</strong><br><span id="message">Keep the probe alive.</span></div>
    </header>
    <div class="table-wrap"><canvas id="game" width="360" height="640" aria-label="Deadlight pinball table"></canvas></div>
    <footer><b>Touch left/right</b> to work the flippers · keyboard: A / D or ← / →</footer>
  </main>
  <div class="overlay" id="overlay" hidden>
    <section class="card"><h2 id="overlay-title">Probe recovered</h2><p id="overlay-copy"></p><div class="choices" id="choices" hidden></div><button id="reset">Start another descent</button></section>
  </div>
  <button class="debug-toggle" id="debug-toggle" type="button">Tune</button>
  <section class="debug-panel" id="debug-panel" hidden aria-label="Physics tuning controls">
    <h3>Live physics tuning</h3>
    <label class="debug-row">Gravity <input data-tune="gravity" type="range" min="0.02" max="0.16" step="0.005" value="0.08"><span class="debug-value" data-value="gravity">0.080</span></label>
    <label class="debug-row">Active kick <input data-tune="activeKick" type="range" min="0.5" max="8" step="0.1" value="4.2"><span class="debug-value" data-value="activeKick">4.20</span></label>
    <label class="debug-row">Catch damping <input data-tune="catchRestitution" type="range" min="0" max="0.5" step="0.01" value="0.14"><span class="debug-value" data-value="catchRestitution">0.14</span></label>
    <label class="debug-row">Moving rebound <input data-tune="movingRestitution" type="range" min="0.1" max="0.9" step="0.01" value="0.46"><span class="debug-value" data-value="movingRestitution">0.46</span></label>
    <label class="debug-row">Passive rebound <input data-tune="passiveRestitution" type="range" min="0.3" max="1" step="0.01" value="0.82"><span class="debug-value" data-value="passiveRestitution">0.82</span></label>
    <label class="debug-row">Speed cap <input data-tune="maxSpeed" type="range" min="3" max="10" step="0.1" value="6.4"><span class="debug-value" data-value="maxSpeed">6.40</span></label>
  </section>
<script>
(() => {
  "use strict";
  const canvas = document.querySelector('#game');
  const ctx = canvas.getContext('2d');
  const stageEl = document.querySelector('#stage');
  const messageEl = document.querySelector('#message');
  const overlay = document.querySelector('#overlay');
  const overlayTitle = document.querySelector('#overlay-title');
  const overlayCopy = document.querySelector('#overlay-copy');
  const choices = document.querySelector('#choices');
  const resetButton = document.querySelector('#reset');
  const debugToggle = document.querySelector('#debug-toggle');
  const debugPanel = document.querySelector('#debug-panel');
  const debugConfig = { gravity: .08, activeKick: 4.2, catchRestitution: .14, movingRestitution: .46, passiveRestitution: .82, maxSpeed: 6.4 };
  debugToggle.addEventListener('click', () => { debugPanel.hidden = !debugPanel.hidden; });
  debugPanel.querySelectorAll('[data-tune]').forEach(inputEl => inputEl.addEventListener('input', () => {
    const key = inputEl.dataset.tune; debugConfig[key] = Number(inputEl.value); if (state && key === 'maxSpeed') state.maxSpeed = debugConfig.maxSpeed; debugPanel.querySelector(`[data-value="${key}"]`).textContent = debugConfig[key].toFixed(2);
  }));
  const upgradePool = [
    { id: 'bulkhead', icon: '◆', title: 'Reinforced bulkhead', text: '+1 maximum Stability and restore one point.', apply: s => { s.stabilityMax += 1; s.stability += 1; } },
    { id: 'coil', icon: 'ϟ', title: 'Tuned launch coil', text: 'Raise the safe ball-speed ceiling for stronger, more controlled returns.', apply: s => { s.maxSpeed += .6; } },
    { id: 'magnet', icon: '✦', title: 'Salvage magnet', text: 'Every salvage target yields an additional Charge.', apply: s => { s.salvageBonus += 1; } }
  ];
  const W = canvas.width, H = canvas.height;
  const table = { left: 18, right: W - 18, top: 18, bottom: H - 18 };
  let input = { left: false, right: false };
  let activePointerId = null;
  let activePointerSide = null;
  let state;
  const targets = [
    { x: 90, y: 164, r: 17, hit: false }, { x: 180, y: 134, r: 17, hit: false }, { x: 270, y: 164, r: 17, hit: false },
    { x: 77, y: 274, r: 15, hit: false }, { x: 283, y: 274, r: 15, hit: false }, { x: 180, y: 242, r: 14, hit: false }
  ];
  const bumpers = [{ x: 112, y: 350, r: 25 }, { x: 248, y: 350, r: 25 }, { x: 180, y: 405, r: 23 }];
  const flippers = {
    left: { pivotX: 64, pivotY: H - 75, length: 78, width: 15, rest: .16, active: -.5, angle: .16, angularVelocity: 0 },
    right: { pivotX: 296, pivotY: H - 75, length: 78, width: 15, rest: Math.PI - .16, active: Math.PI + .5, angle: Math.PI - .16, angularVelocity: 0 }
  };
  const sideGuards = [
    { x1: 36, y1: H - 95, x2: 48, y2: H - 82 },
    { x1: W - 36, y1: H - 95, x2: W - 48, y2: H - 82 }
  ];
  const MAX_BALL_SPEED = 6.4;
  const keys = { a: false, d: false, ArrowLeft: false, ArrowRight: false };

  function reset() {
    state = { stage: 1, stageCount: 3, score: 0, charge: 0, stability: 3, stabilityMax: 3, salvageBonus: 1, maxSpeed: MAX_BALL_SPEED, targets: 0, running: true, launched: false, flash: 0, pulse: 0, flipperEffectCooldown: 0, flipperContacts: { left: false, right: false }, effects: [], message: 'Map the first descent.' };
    input.left = false; input.right = false; activePointerId = null; activePointerSide = null; Object.keys(keys).forEach(key => keys[key] = false);
    targets.forEach(t => t.hit = false);
    choices.hidden = true; choices.replaceChildren(); resetButton.hidden = false; overlay.hidden = true;
    spawnBall();
    updateHud();
  }
  function spawnBall() {
    state.flipperContacts.left = false; state.flipperContacts.right = false;
    state.ball = { x: W / 2, y: H - 108, vx: (Math.random() - .5) * 1.3, vy: -5.1, r: 8, trail: [] };
    state.launched = true;
  }
  function updateHud() {
    stageEl.textContent = state.running ? `DESCENT ${state.stage}/${state.stageCount} · STABILITY ${state.stability}/${state.stabilityMax}` : (state.stability > 0 ? `DESCENT ${state.stage}/${state.stageCount} · RECOVERED` : 'COLLAPSE');
    messageEl.textContent = state.message;
  }
  function setMessage(text) { state.message = text; updateHud(); }
  function emitImpact(x, y, color, power = 1) { state.effects.push({ x, y, color, power, life: 1 }); if (state.effects.length > 36) state.effects.shift(); }
  function hitTarget(target) {
    target.hit = true; state.targets += 1; state.charge = Math.min(99, state.charge + state.salvageBonus); state.score += 100; state.flash = 3; emitImpact(target.x, target.y, '#f1b35b', 1.25);
    setMessage(state.targets === targets.length ? 'Descent mapped. Choose a modification.' : 'Salvage secured.');
    if (state.targets === targets.length) completeStage();
  }
  function completeStage() {
    state.running = false;
    if (state.stage >= state.stageCount) { win(); return; }
    overlayTitle.textContent = `Descent ${state.stage} stabilized`;
    overlayCopy.textContent = `Choose one modification before the probe drops deeper. Charge: ${Math.floor(state.charge)} · Score: ${state.score}.`;
    choices.replaceChildren(...upgradePool.map(upgrade => { const button = document.createElement('button'); button.type = 'button'; button.dataset.upgrade = upgrade.id; button.innerHTML = `<span class="upgrade-icon" aria-hidden="true">${upgrade.icon}</span><span><strong>${upgrade.title}</strong><small>${upgrade.text}</small></span>`; button.addEventListener('click', () => chooseUpgrade(upgrade)); return button; }));
    choices.hidden = false; resetButton.hidden = true; overlay.hidden = false; updateHud();
  }
  function chooseUpgrade(upgrade) {
    upgrade.apply(state); state.stage += 1; state.targets = 0; targets.forEach(t => t.hit = false); state.message = `${upgrade.title} installed.`; choices.hidden = true; choices.replaceChildren(); resetButton.hidden = false; overlay.hidden = true; state.running = true; spawnBall(); updateHud();
  }
  function win() { choices.hidden = true; choices.replaceChildren(); resetButton.hidden = false; overlayTitle.textContent = 'Surface signal acquired'; overlayCopy.textContent = `The probe found a route through the buried machine. Descent complete. Salvage: ${state.charge} · Score: ${state.score}.`; overlay.hidden = false; updateHud(); }
  function lose() { choices.hidden = true; choices.replaceChildren(); resetButton.hidden = false; state.running = false; overlayTitle.textContent = 'Probe lost in the dark'; overlayCopy.textContent = `The tunnel collapsed before the route was mapped. Salvage: ${state.charge} · Score: ${state.score}.`; overlay.hidden = false; updateHud(); }
  function circleCollision(ball, item, restitution = 1) {
    const dx = ball.x - item.x, dy = ball.y - item.y, min = ball.r + item.r;
    const dist = Math.hypot(dx, dy);
    if (dist < min && dist > 0) {
      const nx = dx / dist, ny = dy / dist;
      ball.x = item.x + nx * min; ball.y = item.y + ny * min;
      const dot = ball.vx * nx + ball.vy * ny;
      ball.vx -= (1 + restitution) * dot * nx; ball.vy -= (1 + restitution) * dot * ny;
      return true;
    }
    return false;
  }
  function capBallSpeed(ball, maxSpeed = state?.maxSpeed || MAX_BALL_SPEED) {
    const speed = Math.hypot(ball.vx, ball.vy);
    if (speed > maxSpeed) { const scale = maxSpeed / speed; ball.vx *= scale; ball.vy *= scale; }
  }
  function flipperEndpoints(flipper) {
    return { x1: flipper.pivotX, y1: flipper.pivotY, x2: flipper.pivotX + Math.cos(flipper.angle) * flipper.length, y2: flipper.pivotY + Math.sin(flipper.angle) * flipper.length };
  }
  function segmentCollision(ball, segment, restitution = .82, kick = 0) {
    const dx = segment.x2 - segment.x1, dy = segment.y2 - segment.y1;
    const lengthSquared = dx * dx + dy * dy || 1;
    const projection = Math.max(0, Math.min(1, ((ball.x - segment.x1) * dx + (ball.y - segment.y1) * dy) / lengthSquared));
    const closestX = segment.x1 + projection * dx, closestY = segment.y1 + projection * dy;
    let nx = ball.x - closestX, ny = ball.y - closestY;
    const distance = Math.hypot(nx, ny), radius = ball.r + (segment.width || 0) / 2;
    if (distance >= radius) return null;
    if (distance < .001) { nx = -dy; ny = dx; }
    const normalLength = Math.hypot(nx, ny) || 1;
    nx /= normalLength; ny /= normalLength;
    ball.x = closestX + nx * radius; ball.y = closestY + ny * radius;
    const incoming = ball.vx * nx + ball.vy * ny;
    if (incoming < 0) {
      ball.vx -= (1 + restitution) * incoming * nx; ball.vy -= (1 + restitution) * incoming * ny;
      ball.vx += nx * kick; ball.vy += ny * kick;
    }
    capBallSpeed(ball);
    return { x: closestX, y: closestY, nx, ny };
  }
  function updateFlippers() {
    const leftTarget = input.left ? flippers.left.active : flippers.left.rest;
    const rightTarget = input.right ? flippers.right.active : flippers.right.rest;
    const leftPrevious = flippers.left.angle, rightPrevious = flippers.right.angle;
    flippers.left.angle += (leftTarget - flippers.left.angle) * .28;
    flippers.right.angle += (rightTarget - flippers.right.angle) * .28;
    flippers.left.angularVelocity = flippers.left.angle - leftPrevious;
    flippers.right.angularVelocity = flippers.right.angle - rightPrevious;
  }
  function update() {
    if (!state.running) return;
    const b = state.ball;
    state.pulse += .08; state.flash = Math.max(0, state.flash - 1); state.flipperEffectCooldown = Math.max(0, state.flipperEffectCooldown - 1); state.effects.forEach(effect => effect.life -= .08); state.effects = state.effects.filter(effect => effect.life > 0);
    updateFlippers();
    b.vy += debugConfig.gravity; b.vx *= .999; b.vy *= .999;
    b.x += b.vx; b.y += b.vy;
    b.trail.push({ x: b.x, y: b.y }); if (b.trail.length > 10) b.trail.shift();
    if (b.x - b.r < table.left) { b.x = table.left + b.r; b.vx = Math.abs(b.vx) * .96; }
    if (b.x + b.r > table.right) { b.x = table.right - b.r; b.vx = -Math.abs(b.vx) * .96; }
    if (b.y - b.r < table.top) { b.y = table.top + b.r; b.vy = Math.abs(b.vy) * .92; }
    targets.filter(t => !t.hit).forEach(t => { if (circleCollision(b, t, 1.05)) hitTarget(t); });
    bumpers.forEach(item => { if (circleCollision(b, item, 1.18)) { state.score += 25; state.charge = Math.min(99, state.charge + .1); emitImpact(item.x, item.y, '#b5d3a1', .8); capBallSpeed(b); setMessage('Generator impact. Charge rising.'); } });
    sideGuards.forEach(guard => segmentCollision(b, { ...guard, width: 12 }, .9));
    const leftActive = input.left;
    const rightActive = input.right;
    const leftMotion = Math.abs(flippers.left.angularVelocity);
    const rightMotion = Math.abs(flippers.right.angularVelocity);
    const leftRestitution = leftActive ? (leftMotion < .04 ? debugConfig.catchRestitution : debugConfig.movingRestitution) : debugConfig.passiveRestitution;
    const rightRestitution = rightActive ? (rightMotion < .04 ? debugConfig.catchRestitution : debugConfig.movingRestitution) : debugConfig.passiveRestitution;
    const leftKick = leftActive && !state.flipperContacts.left ? Math.min(debugConfig.activeKick, .08 + leftMotion * 20) : (leftActive ? 0 : .2);
    const rightKick = rightActive && !state.flipperContacts.right ? Math.min(debugConfig.activeKick, .08 + rightMotion * 20) : (rightActive ? 0 : .2);
    const leftHit = segmentCollision(b, { ...flipperEndpoints(flippers.left), width: flippers.left.width }, leftRestitution, leftKick);
    const rightHit = segmentCollision(b, { ...flipperEndpoints(flippers.right), width: flippers.right.width }, rightRestitution, rightKick);
    state.flipperContacts.left = Boolean(leftHit);
    state.flipperContacts.right = Boolean(rightHit);
    if (state.flipperEffectCooldown === 0 && (leftHit || rightHit) && (input.left || input.right)) { const hit = leftHit || rightHit; emitImpact(hit.x, hit.y, '#ffd083', .55); state.flipperEffectCooldown = 5; }
    capBallSpeed(b);
    if (b.y > H - 35) {
      state.stability -= 1; state.charge = Math.max(0, Math.floor(state.charge - 1));
      if (state.stability <= 0) lose(); else { setMessage('Probe recovered. Stability lost.'); spawnBall(); }
    }
    updateHud();
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    const deck = ctx.createLinearGradient(0, 0, W, H); deck.addColorStop(0, '#253b3a'); deck.addColorStop(.5, '#182326'); deck.addColorStop(1, '#0c1215');
    ctx.fillStyle = deck; ctx.fillRect(0, 0, W, H);
    const coreGlow = ctx.createRadialGradient(W / 2, 290, 20, W / 2, 290, 260); coreGlow.addColorStop(0, 'rgba(91,166,125,.16)'); coreGlow.addColorStop(1, 'rgba(10,18,20,0)'); ctx.fillStyle = coreGlow; ctx.fillRect(20, 20, W - 40, H - 40);
    ctx.fillStyle = 'rgba(7,13,15,.55)'; ctx.fillRect(24, 28, 11, H - 68); ctx.fillRect(W - 35, 28, 11, H - 68);
    ctx.save(); ctx.strokeStyle = 'rgba(141,168,149,.18)'; ctx.lineWidth = 2;
    for (let y = 30; y < H - 20; y += 26) { ctx.beginPath(); ctx.moveTo(24, y); ctx.lineTo(W - 24, y); ctx.stroke(); }
    ctx.strokeStyle = 'rgba(241,179,91,.08)'; ctx.lineWidth = 1;
    for (let x = 42; x < W - 40; x += 34) { ctx.beginPath(); ctx.moveTo(x, 30); ctx.lineTo(x, H - 42); ctx.stroke(); }
    ctx.restore();
    ctx.strokeStyle = '#8da895'; ctx.lineWidth = 5; ctx.strokeRect(table.left, table.top, table.right - table.left, table.bottom - table.top);
    ctx.strokeStyle = 'rgba(241,179,91,.2)'; ctx.lineWidth = 1; ctx.strokeRect(table.left + 7, table.top + 7, table.right - table.left - 14, table.bottom - table.top - 14);
    ctx.fillStyle = 'rgba(9,17,19,.84)'; ctx.fillRect(30, H - 125, W - 60, 88);
    drawEdgeMachinery(); drawReactor(); drawTargets(); drawBumpers(); drawFlippers(); drawMeters(); drawEffects(); drawBall();
    if (state.flash > 0) { ctx.fillStyle = `rgba(241,179,91,${state.flash / 40})`; ctx.fillRect(20, 20, W - 40, H - 40); }
  }
  function drawEdgeMachinery() {
    ctx.save();
    ctx.fillStyle = '#080e10'; ctx.beginPath(); ctx.moveTo(151, H - 38); ctx.lineTo(209, H - 38); ctx.lineTo(191, H - 62); ctx.lineTo(169, H - 62); ctx.closePath(); ctx.fill();

    ctx.strokeStyle = '#526e63'; ctx.lineWidth = 3; ctx.stroke();
    [[64, H - 75], [296, H - 75]].forEach(([x, y]) => {
      ctx.beginPath(); ctx.arc(x, y, 19, 0, Math.PI * 2); ctx.fillStyle = '#101a1c'; ctx.fill(); ctx.strokeStyle = '#789487'; ctx.lineWidth = 3; ctx.stroke();
      ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI * 2); ctx.fillStyle = '#314f4a'; ctx.fill(); ctx.strokeStyle = '#b5d3a1'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = '#f1b35b'; ctx.fillRect(x - 27, y - 3, 12, 6); ctx.fillRect(x + 15, y - 3, 12, 6);
    });
    ctx.strokeStyle = '#526e63'; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(42, H - 43); ctx.lineTo(156, H - 43); ctx.moveTo(204, H - 43); ctx.lineTo(W - 42, H - 43); ctx.stroke();
    ctx.restore();
  }
  function drawReactor() {
    const reactor = ctx.createLinearGradient(62, 54, 62, 102); reactor.addColorStop(0, '#3a5b52'); reactor.addColorStop(1, '#172827');
    ctx.fillStyle = reactor; ctx.fillRect(62, 54, W - 124, 48); ctx.strokeStyle = '#8da895'; ctx.lineWidth = 2; ctx.strokeRect(62, 54, W - 124, 48);
    ctx.fillStyle = '#f1b35b'; ctx.font = 'bold 11px Trebuchet MS'; ctx.textAlign = 'center'; ctx.fillText('SURFACE SIGNAL // MAP THE ROUTE', W / 2, 82);
    ctx.fillStyle = '#b5d3a1'; [70, W - 70].forEach(x => { ctx.beginPath(); ctx.arc(x, 78, 4, 0, Math.PI * 2); ctx.fill(); });
  }
  function drawTargets() {
    targets.forEach(t => { ctx.beginPath(); ctx.arc(t.x, t.y, t.r + 4 + Math.sin(state.pulse + t.x) * 2, 0, Math.PI * 2); ctx.fillStyle = t.hit ? '#344743' : '#c56d49'; ctx.fill(); ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2); ctx.fillStyle = t.hit ? '#6b8172' : '#efba6a'; ctx.fill(); ctx.fillStyle = '#182226'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(t.hit ? '✓' : '+1', t.x, t.y + 3); });
  }
  function drawBumpers() { bumpers.forEach(item => { ctx.beginPath(); ctx.arc(item.x, item.y, item.r + 5, 0, Math.PI * 2); ctx.fillStyle = '#314f4a'; ctx.fill(); ctx.beginPath(); ctx.arc(item.x, item.y, item.r, 0, Math.PI * 2); ctx.fillStyle = '#6f9b84'; ctx.fill(); ctx.strokeStyle = '#b5d3a1'; ctx.lineWidth = 2; ctx.stroke(); }); }
  function drawFlippers() {
    sideGuards.forEach(guard => {
      ctx.beginPath(); ctx.moveTo(guard.x1, guard.y1); ctx.lineTo(guard.x2, guard.y2);
      ctx.strokeStyle = '#57756a'; ctx.lineWidth = 12; ctx.lineCap = 'round'; ctx.stroke();
      ctx.strokeStyle = '#8da895'; ctx.lineWidth = 3; ctx.stroke();
    });
    [flippers.left, flippers.right].forEach(flipper => {
      const end = flipperEndpoints(flipper);
      const active = flipper === flippers.left ? input.left : input.right;
      const moving = Math.abs(flipper.angularVelocity) > .04;
      ctx.save(); ctx.shadowColor = active ? '#f1b35b' : 'transparent'; ctx.shadowBlur = active ? (moving ? 14 : 5) : 0;
      ctx.beginPath(); ctx.moveTo(end.x1, end.y1); ctx.lineTo(end.x2, end.y2);
      ctx.strokeStyle = active ? (moving ? '#fff0ba' : '#ffd083') : '#f1b35b';
      ctx.lineWidth = flipper.width; ctx.lineCap = 'round'; ctx.stroke();
      ctx.restore();
      ctx.beginPath(); ctx.moveTo(end.x1, end.y1); ctx.lineTo(end.x2, end.y2);
      ctx.strokeStyle = '#fff0ba'; ctx.lineWidth = 2; ctx.stroke();
      ctx.beginPath(); ctx.arc(flipper.pivotX, flipper.pivotY, 9, 0, Math.PI * 2); ctx.fillStyle = '#314f4a'; ctx.fill(); ctx.strokeStyle = '#b5d3a1'; ctx.stroke();
    });
    const displayScale = canvas.getBoundingClientRect().width / W || 1;
    const labelFont = Math.max(13, Math.min(19, 14 / displayScale));
    ctx.font = `bold ${labelFont}px Trebuchet MS`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    [['LIFT L', 76], ['LIFT R', 284]].forEach(([label, x]) => {
      const width = ctx.measureText(label).width + 14;
      ctx.fillStyle = 'rgba(7,13,15,.82)'; ctx.fillRect(x - width / 2, H - 118, width, 22);
      ctx.strokeStyle = 'rgba(141,168,149,.72)'; ctx.lineWidth = 1; ctx.strokeRect(x - width / 2, H - 118, width, 22);
      ctx.strokeStyle = '#0b1112'; ctx.lineWidth = 3; ctx.strokeText(label, x, H - 107);
      ctx.fillStyle = 'rgba(229,241,223,.94)'; ctx.fillText(label, x, H - 107);
    });
    ctx.textBaseline = 'alphabetic';
  }
  function drawMeters() {
    ctx.textAlign = 'left'; ctx.font = 'bold 13px Trebuchet MS'; ctx.fillStyle = '#c4d2bd'; ctx.fillText(`CHARGE ${Math.floor(state.charge)}`, 34, 124); ctx.fillText(`SALVAGE ${state.targets}/${targets.length}`, 220, 124);
    ctx.fillStyle = '#253c39'; ctx.fillRect(34, 130, 130, 7); ctx.fillRect(220, 130, 106, 7);
    ctx.fillStyle = '#f1b35b'; ctx.fillRect(34, 130, Math.min(130, state.charge * 13), 7); ctx.fillStyle = '#c56d49'; ctx.fillRect(220, 130, 106 * (state.targets / targets.length), 7);
  }
  function drawEffects() {
    state.effects.forEach(effect => {
      const radius = (1 - effect.life) * 28 * effect.power + 5;
      ctx.save(); ctx.globalAlpha = effect.life; ctx.strokeStyle = effect.color; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(effect.x, effect.y, radius, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = effect.life * .8; ctx.fillStyle = effect.color;
      for (let i = 0; i < 6; i += 1) { const angle = state.pulse * .4 + i * Math.PI / 3; const distance = radius + 4; ctx.beginPath(); ctx.arc(effect.x + Math.cos(angle) * distance, effect.y + Math.sin(angle) * distance, 2 * effect.power, 0, Math.PI * 2); ctx.fill(); }
      ctx.restore();
    });
  }
  function drawBall() {
    const b = state.ball;
    b.trail.forEach((point, index) => { const alpha = (index + 1) / b.trail.length * .18; ctx.beginPath(); ctx.arc(point.x, point.y, Math.max(2, b.r * (index + 1) / b.trail.length), 0, Math.PI * 2); ctx.fillStyle = `rgba(241,179,91,${alpha})`; ctx.fill(); });
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 3, 0, Math.PI * 2); ctx.fillStyle = 'rgba(241,179,91,.18)'; ctx.fill();
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fillStyle = '#f4f0d5'; ctx.fill(); ctx.strokeStyle = '#f1b35b'; ctx.stroke();
  }
  let previousTime = 0;
  let timeAccumulator = 0;
  function loop(timestamp = 0) {
    if (!previousTime) previousTime = timestamp;
    timeAccumulator += Math.min(3, (timestamp - previousTime) / (1000 / 60));
    previousTime = timestamp;
    while (timeAccumulator >= 1) { update(); timeAccumulator -= 1; }
    draw(); requestAnimationFrame(loop);
  }
  function setControl(side, value) { input[side] = value; }
  function syncInput() { input.left = keys.a || keys.ArrowLeft || activePointerSide === 'left'; input.right = keys.d || keys.ArrowRight || activePointerSide === 'right'; }
  function clearPointerControl(pointerId = null) { if (pointerId !== null && pointerId !== activePointerId) return; activePointerId = null; activePointerSide = null; syncInput(); }
  canvas.addEventListener('pointerdown', event => { const rect = canvas.getBoundingClientRect(); const x = (event.clientX - rect.left) * W / rect.width; clearPointerControl(); activePointerId = event.pointerId; activePointerSide = x < W / 2 ? 'left' : 'right'; syncInput(); try { canvas.setPointerCapture(event.pointerId); } catch (_) {} });
  canvas.addEventListener('pointerup', event => { clearPointerControl(event.pointerId); });
  canvas.addEventListener('pointercancel', event => { clearPointerControl(event.pointerId); });
  canvas.addEventListener('lostpointercapture', event => { clearPointerControl(event.pointerId); });
  window.addEventListener('keydown', event => { if (event.key in keys) { keys[event.key] = true; syncInput(); event.preventDefault(); } });
  window.addEventListener('keyup', event => { if (event.key in keys) { keys[event.key] = false; syncInput(); event.preventDefault(); } });
  resetButton.addEventListener('click', reset);
  reset(); loop();
})();
</script>
